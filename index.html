:root{color-scheme:dark}
html,body{background:#0c121b;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
*{min-width:0}
@keyframes tr{0%,100%{box-shadow:0 0 0 2px #38bdf8}50%{box-shadow:0 0 0 2px rgba(56,189,248,.25)}}
.target-ring{animation:tr 1.3s ease-in-out infinite;border-radius:3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.blink{animation:blink .9s steps(2,start) infinite}
@keyframes bbr{0%,100%{background:#ff3b30}50%{background:#7f1d1d}}
.blink-bg-red{animation:bbr .8s infinite}
@keyframes pop{from{transform:translateY(3px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .2s ease-out}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.7}}
.flicker{animation:flick .18s infinite}
@keyframes soft{0%,100%{opacity:1}50%{opacity:.55}}
.pulse-soft{animation:soft 1.6s ease-in-out infinite}
@keyframes fade{from{opacity:1}to{opacity:0}}
.fadeout{animation:fade 3.5s ease-out forwards}
@keyframes dimf{0%,100%{filter:brightness(1)}45%{filter:brightness(.55)}50%{filter:brightness(.9)}55%{filter:brightness(.5)}}
.dim-flicker{animation:dimf 1.7s infinite}
.ann-lit{box-shadow:0 0 8px currentColor,inset 0 0 4px rgba(255,255,255,.35)}
.info-btn{width:22px;height:22px;border-radius:999px;border:1px solid #cbd5e1;background:#0b1220;color:#e2e8f0;font:700 11px Georgia,serif;display:inline-grid;place-items:center;flex:none}
.info-btn:hover{background:#1e3a5f}
.hotspot:hover circle:nth-of-type(2){fill:#1e3a5f}
.thr{-webkit-appearance:none;appearance:none;height:8px;border-radius:2px;background:linear-gradient(90deg,#3b4249,#94a3b8);outline:none;width:100%}
.thr:focus-visible{box-shadow:0 0 0 2px #38bdf8}
.thr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;border-radius:3px;background:#d4d8dc;border:2px solid #111;cursor:grab}
.thr::-moz-range-thumb{width:20px;height:24px;border-radius:3px;background:#d4d8dc;border:2px solid #111;cursor:grab}
button:focus-visible{outline:2px solid #38bdf8;outline-offset:1px}
@media (prefers-reduced-motion:reduce){.target-ring,.blink,.flicker,.pulse-soft,.dim-flicker,.blink-bg-red{animation:none}}

ding \xB7 Aproximaci\xF3n y aterrizaje",why:"Pr\xE1ctica de entrenamiento: APU encendido como respaldo. LVL CHG inicia el descenso con el A/T en RETARD/ARM. APP arma el ILS (VOR/LOC y G/S). Tren abajo antes de 1,000 ft. A 27 ft el A/T hace RETARD; al tocar, MAX REV; a 60 kt, REV IDLE hasta detenerse."},{n:6,short:"Apagado",title:"Shutdown \xB7 Apagado seguro",why:"Reversas guardadas y motores en IDLE para enfriarse (el CFM56-7B pide 3 minutos; aqu\xED 10 s). Antes de cortar, la energ\xEDa pasa al APU. Luego START LEVERS a CUTOFF, APU OFF y bater\xEDa OFF. Mientras giren los motores, nadie se acerca al frente (succi\xF3n) ni detr\xE1s (chorro)."}],Eh={fan:{t:"Fan del CFM56-7B",que:"Ventilador de 1.55 m de di\xE1metro con 24 \xE1labes anchos de titanio macizo.",como:"Lo mueve la turbina de baja presi\xF3n (N1). Cerca de 5 partes de aire pasan por fuera del n\xFAcleo por cada parte que entra (bypass ~5.1:1) y dan la mayor parte del empuje. La toma de aire del 737 es aplanada abajo porque el motor va muy cerca del suelo.",riesgo:"Ingesti\xF3n de aves u objetos (FOD). Por eso se revisa la entrada del motor en el walk-around."},compresor:{t:"Compresor: booster (3) + alta presi\xF3n (9)",que:"3 etapas de baja presi\xF3n (booster) y 9 de alta presi\xF3n (N2).",como:"Cada etapa aprieta el aire. El arrancador neum\xE1tico hace girar el compresor de alta presi\xF3n durante el arranque.",riesgo:"P\xE9rdida de compresor (surge): estallido, vibraci\xF3n y subida de EGT."},camara:{t:"C\xE1mara de combusti\xF3n anular",que:"Un anillo con 20 inyectores y dos buj\xEDas (ignici\xF3n L y R).",como:"Al poner la START LEVER en IDLE se abre el combustible y la ignici\xF3n enciende la mezcla (light-off).",riesgo:"Combustible de m\xE1s con poco aire = arranque caliente: la EGT pasa el l\xEDmite de arranque (725 \xB0C)."},turbina:{t:"Turbinas: alta presi\xF3n (1) + baja presi\xF3n (4)",que:"1 etapa de alta presi\xF3n (mueve N2) y 4 de baja presi\xF3n (mueven el fan, N1).",como:"El gas caliente las hace girar. La EGT es la temperatura del gas entre ambas.",riesgo:"Con EGT en rojo (950 \xB0C en despegue) los \xE1labes se da\xF1an y hay que inspeccionar el motor."},tobera:{t:"Tobera y reversas",que:"Salida del motor y manga m\xF3vil de las reversas.",como:"Al aterrizar la manga se desliza hacia atr\xE1s y las cascadas desv\xEDan el aire del fan hacia adelante. En la pantalla de motores aparece REV.",riesgo:"Las reversas solo funcionan con el avi\xF3n en tierra. Detr\xE1s del motor el chorro es peligroso incluso en IDLE."},apu:{t:"APU Honeywell 131-9B",que:"Una turbina peque\xF1a en el cono de cola.",como:"Al girar el switch a START, la compuerta de admisi\xF3n abre y un motor el\xE9ctrico lo arranca. Cuando est\xE1 listo se ilumina APU GEN OFF BUS (azul): ya puede dar electricidad a los buses y aire (APU BLEED).",riesgo:"Fuego en el compartimento: campana de fuego y luz en el APU FIRE SWITCH. Se jala y se gira para descargar la botella."},ducto:{t:"Ductos neum\xE1ticos y DUCT PRESS",que:"Tubos que llevan aire caliente del APU y de los motores. El indicador DUCT PRESS muestra la presi\xF3n izquierda (L) y derecha (R).",como:"Con APU BLEED ON y PACKs en OFF hay ~35 PSI para el arranque. Durante el giro del motor la presi\xF3n baja un poco.",riesgo:"Una fuga enciende WING-BODY OVERHEAT. Con el APU, la acci\xF3n es APU BLEED OFF."},arrancador:{t:"Arrancador neum\xE1tico (ATS)",que:"Turbina de aire montada en la caja de accesorios.",como:"En GRD la v\xE1lvula de arranque se abre y el arrancador gira N2. A 56% N2 se desconecta y el selector vuelve a OFF. En la pantalla de motores aparece START VALVE OPEN mientras est\xE1 abierta.",riesgo:"Si la v\xE1lvula no cierra, el arrancador se sobrevelocita: hay que cerrar el aire."},generador:{t:"IDG y buses de transferencia",que:"Cada motor mueve un generador (IDG) de 90 kVA. El APU tiene otro.",como:"Cada bus de transferencia (1 y 2) recibe energ\xEDa de la fuente seleccionada por \xFAltimo: GEN del motor o APU GEN. Las luces azules OFF BUS indican una fuente lista pero desconectada.",riesgo:"Si se pierden ambos IDG, se encienden TRANSFER BUS OFF y SOURCE OFF: hay que conectar el APU."},succion:{t:"Zona de succi\xF3n",que:"El \xE1rea frente a la toma de aire del motor.",como:"El fan aspira con fuerza suficiente para jalar personas y objetos.",riesgo:"Con un motor encendido nadie entra a esta zona."},chorro:{t:"Chorro caliente",que:"La zona detr\xE1s del motor.",como:"Gas caliente y aire del fan a gran velocidad, incluso en IDLE.",riesgo:"Puede quemar, derribar personas y lanzar objetos."},pfd:{t:"PFD (Primary Flight Display)",que:"Pantalla principal de vuelo del 737NG.",como:"Arriba, el FMA: autothrottle (N1, THR HLD, ARM, MCP SPD, RETARD), modo lateral y modo vertical; abajo el estado (FD, CMD). Izquierda velocidad con caja digital, centro actitud, derecha altitud y velocidad vertical. En magenta, lo seleccionado en el MCP.",riesgo:"Hay que leer el FMA despu\xE9s de cada cambio: es la forma de saber qu\xE9 est\xE1 haciendo el avi\xF3n."},edu:{t:"Upper DU \xB7 Pantalla de motores",que:"Muestra N1 y EGT de los dos motores, m\xE1s N2 y flujo de combustible.",como:"Arriba, el modo y l\xEDmite de empuje (TO, CLB, CRZ). La aguja blanca y el sector gris marcan el valor; la l\xEDnea roja es el l\xEDmite. Durante el arranque aparece START VALVE OPEN y la l\xEDnea roja de arranque de EGT (725 \xB0C).",riesgo:"Una EGT que pasa la l\xEDnea roja obliga a cortar el combustible y reportar."},ldu:{t:"Lower DU",que:"Pantalla inferior: motores secundarios (ENG) o sistemas (SYS).",como:"ENG: presi\xF3n, temperatura y cantidad de aceite, y vibraci\xF3n. SYS: hidr\xE1ulicos A y B.",riesgo:"Sin buses de transferencia (solo bater\xEDa) esta pantalla queda apagada."},mcp:{t:"MCP (Mode Control Panel)",que:"El panel del piloto autom\xE1tico en el glareshield.",como:"A/T ARM arma el autothrottle; N1 y SPEED fijan su modo; LVL CHG cambia de nivel; APP arma el ILS; CMD A conecta el piloto autom\xE1tico. La
